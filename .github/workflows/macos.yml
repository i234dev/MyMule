name: macOS

# Tests on macOS, apart from CI: hosted macOS runners are often scarce,
# and when GitHub finds none free for about 15 minutes it cancels the job.
# On its own here, that never turns CI red or holds up a build or a
# release (the macOS binaries are cross-compiled on Linux anyway), and
# macos-retry.yml runs it again until a runner takes it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 5m ./...
