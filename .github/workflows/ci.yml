name: CI

# Every push and pull request: tests on Windows, Linux and macOS, a check
# for known vulnerabilities, then binaries for every platform attached to
# the run (Actions tab). Pushing a tag vX.Y.Z also publishes a GitHub
# Release with those binaries and a signed build provenance attestation.
#
# Actions are pinned to a commit (the version is in the comment): a tag can
# be moved to other code, a commit cannot.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 5m ./...

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Hosted macOS runners are often scarce: when none is free the job is
  # cancelled. It runs on its own so it never blocks builds or releases
  # (macOS binaries are cross-compiled on Linux anyway).
  test-macos:
    name: Test (macos-latest, informative)
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -timeout 5m ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: [test, vulncheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          arch="${GOARCH}${GOARM:+v$GOARM}"
          name="mymule-${version}-${GOOS}-${arch}"
          exe="mymule"; [ "$GOOS" = windows ] && exe="mymule.exe"

          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$name/$exe" ./cmd/mymule
          cp LICENSE README.md "dist/$name/"

          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mymule-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # to sign the attestation (Sigstore, no keys to keep)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # A signed statement, kept by GitHub, that each file was built by this
      # workflow from this repository and commit. Unlike SHA256SUMS, which
      # sits next to the files it describes, it cannot be replaced along
      # with them. Check with: gh attestation verify FILE --repo OWNER/REPO
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"   # e.g. v0.5.0-beta1
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MyMule $GITHUB_REF_NAME" \
            --generate-notes $prerelease
